<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page Not Found | SSDSportAcademy</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f9fc;
        color: #132238;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: linear-gradient(135deg, #f7f9fc 0%, #eef4ff 100%);
      }

      .card {
        width: min(100%, 560px);
        background: #ffffff;
        border-radius: 24px;
        padding: 40px 32px;
        box-shadow: 0 20px 45px rgba(19, 34, 56, 0.12);
        text-align: center;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 72px;
        height: 72px;
        border-radius: 999px;
        background: #fff3e8;
        color: #d46f00;
        font-size: 32px;
        font-weight: 800;
        margin-bottom: 16px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 2rem;
        color: #132238;
      }

      p {
        margin: 0 0 18px;
        font-size: 1rem;
        line-height: 1.6;
        color: #4c5d78;
      }

      .link {
        display: inline-block;
        margin-top: 8px;
        color: #0c8f66;
        font-weight: 700;
        text-decoration: none;
      }

      .link:hover,
      .link:focus-visible {
        text-decoration: underline;
      }

      .home-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 20px;
        padding: 12px 20px;
        border-radius: 999px;
        background: #0c8f66;
        color: white;
        text-decoration: none;
        font-weight: 700;
      }

      .home-button:hover,
      .home-button:focus-visible {
        background: #0a744f;
      }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <div class="badge" aria-hidden="true">404</div>
      <h1>Page not found</h1>
      <p>
        The page you are looking for does not exist or may have been moved.
        You will be redirected to our homepage shortly.
      </p>
      <p>
        If you are not redirected automatically, please visit
        <a class="link" href="https://www.ssdsportacademy.com/">www.ssdsportacademy.com</a>
      </p>
      <a class="home-button" href="https://www.ssdsportacademy.com/">Go to homepage</a>
    </main>

    <script>
      const targetUrl = "https://www.ssdsportacademy.com/";
      window.setTimeout(() => {
        window.location.replace(targetUrl);
      }, 5000);
    </script>
  </body>
</html>
